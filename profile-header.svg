<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#a9b9ed" opacity=".18"/></pattern>
<radialGradient id="glow"><stop stop-color="#283957" stop-opacity=".6"/><stop offset="1" stop-color="#0b0d12" stop-opacity="0"/></radialGradient>
<clipPath id="clip"><rect x="1" y="1" width="1278" height="688" rx="18"/></clipPath>
</defs>
