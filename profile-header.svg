<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Erik Tran — Data science, with a practical point of view.</title>
<desc id="desc">William and Mary Data Science, class of 2028. Interests: machine learning, fintech, consulting. Projects: OptionLab, options analytics; PlatePredict, calorie prediction with six regression model families. Languages: Python, R, SQL, Bash. Tools: pandas, NumPy, scikit-learn, PyTorch, Tableau, Excel, Stata.</desc>
<style>
.orbit-trail { stroke-dasharray: 16 84; animation: trail-flow 16s linear infinite; }
.trail-two { animation-duration: 21s; animation-direction: reverse; }
.trail-three { animation-duration: 27s; }
@keyframes trail-flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -100; } }
.building-dot { animation: building-pulse 3s ease-in-out infinite; }
.building-halo { animation: halo-pulse 3s ease-in-out infinite; }
@keyframes building-pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
@keyframes halo-pulse { 0%,100% { opacity: .05; } 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .orbit-trail, .building-dot, .building-halo { animation: none; } }
</style>
<defs>
