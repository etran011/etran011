<stop offset="0" stop-color="white" stop-opacity="1"/>
<stop offset=".42" stop-color="white" stop-opacity=".85"/>
<stop offset=".75" stop-color="white" stop-opacity=".25"/>
<stop offset="1" stop-color="white" stop-opacity="0"/>
</radialGradient>
<mask id="dotFieldMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="690">
<rect width="1280" height="690" fill="url(#dotFade)"/>
</mask>

